<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Espera VIP - Portería</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8">
  
  <!-- Encabezado con anclaje absoluto para que no salte -->
  <div class="relative flex justify-center items-center mb-12 h-16">
    <h1 class="text-5xl font-extrabold text-center tracking-tight absolute">Recepción Logística</h1>
    <button id="btnAudio" class="absolute right-0 bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-bold shadow-lg transition-all" onclick="iniciarAudio()">
      🔊 Activar Sonido
    </button>
  </div>
  
  <div id="pantallaEspera" class="grid gap-6"></div>

  <audio id="alertaSonido" src="https://actions.google.com/sounds/v1/doors/doorbell_ring.ogg" preload="auto"></audio>

  <script>
    // ACA VA SU URL DE APPS SCRIPT (MANTENGA LAS COMILLAS SIMPLES A LOS LADOS)
    const webAppUrl = 'https://script.google.com/macros/s/AKfycbwI3yucl41fv6vlmDsr3iNQmPScEAcAAj1el6Afrkxve0mC5i43GQdV9AQhlKZ_mk_1Bw/exec';
    
    let audioActivado = false;
    let vipConocidos = new Set();

    function iniciarAudio() {
      audioActivado = true;
      document.getElementById('alertaSonido').play().catch(e => console.log('Esperando interacción'));
      // En vez de esconderlo y romper el diseño, lo hacemos invisible
      document.getElementById('btnAudio').classList.add('invisible'); 
    }

    function getColorClasses(estado) {
      switch(estado) {
        case 'Verde': return 'bg-emerald-500 border-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.3)]';
        case 'Amarillo': return 'bg-amber-500 border-amber-400 shadow-[0_0_20px_rgba(245,158,11,0.5)]';
        case 'Rojo': return 'bg-rose-600 border-rose-500 shadow-[0_0_30px_rgba(225,29,72,0.8)] pulse-animation';
        default: return 'bg-gray-500';
      }
    }

    function renderDashboard(data) {
      const container = document.getElementById('pantallaEspera');
      container.innerHTML = '';
      
      if(!data || data.length === 0) {
        container.innerHTML = '<h2 class="text-4xl text-center text-gray-500 mt-20 font-light">Patio Despejado</h2>';
        return;
      }

      const ahora = new Date();
      let nuevoVipDetectado = false;

      data.sort((a, b) => {
        if (a.preferencia && !b.preferencia) return -1;
        if (!a.preferencia && b.preferencia) return 1;
        return new Date(a.espera) - new Date(b.espera);
      });

      data.forEach(item => {
        if (item.preferencia && !vipConocidos.has(item.idUnico)) {
          nuevoVipDetectado = true;
          vipConocidos.add(item.idUnico);
        }

        const horaLlegada = new Date(item.espera); 
        const diffMs = ahora - horaLlegada;
        let minutosEspera = Math.floor(diffMs / 60000);
        if (isNaN(minutosEspera) || minutosEspera < 0) minutosEspera = 0;

        let estadoReal = 'Verde';
        if (minutosEspera > 5) estadoReal = 'Amarillo';
        if (minutosEspera > 15) estadoReal = 'Rojo';

        const colors = getColorClasses(estadoReal);
        const preferenciaBadge = item.preferencia ? `<div class="absolute -top-5 -left-5 bg-gradient-to-r from-yellow-300 to-yellow-500 text-black font-black text-xl px-6 py-2 rounded-full shadow-2xl border-4 border-slate-900 transform -rotate-12 z-10 animate-bounce">⭐ PREFERENCIA / CITA</div>` : '';
        
        const card = `
          <div class="relative flex items-center justify-between p-8 rounded-2xl border-2 ${colors} transition-all transform hover:scale-[1.01]">
            ${preferenciaBadge}
            <div class="flex flex-col ml-6 w-1/4">
              <span class="text-sm font-bold uppercase tracking-widest opacity-80 text-white drop-shadow-md">Patente</span>
              <span class="text-5xl font-black text-white drop-shadow-lg">${item.patente}</span>
            </div>
            <div class="text-center w-2/4">
              <span class="block text-sm font-bold uppercase tracking-widest opacity-80 text-white drop-shadow-md">Orden de Compra</span>
              <span class="text-4xl font-bold text-white drop-shadow-lg">${item.oc}</span>
            </div>
            <div class="text-right w-1/4">
              <span class="block text-sm font-bold uppercase tracking-widest opacity-80 text-white drop-shadow-md">Espera</span>
              <span class="text-6xl font-black text-white drop-shadow-lg">${minutosEspera} <span class="text-2xl">Min</span></span>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', card);
      });

      if (nuevoVipDetectado && audioActivado) {
        document.getElementById('alertaSonido').play().catch(e => console.log('Audio no reproducido'));
      }
    }

    async function fetchData() {
      try {
        const response = await fetch(webAppUrl);
        // Si Google devuelve un error, lo atrapamos aquí en vez de quedar en negro
        if (!response.ok) throw new Error("Error en la respuesta de Google"); 
        
        const data = await response.json();
        renderDashboard(data);
      } catch (error) {
        console.error("Error obteniendo datos:", error);
        // Mostramos el error en pantalla para no adivinar
        document.getElementById('pantallaEspera').innerHTML = `
          <div class="bg-red-900 border border-red-500 text-white p-6 rounded-lg max-w-2xl mx-auto mt-10 text-center">
            <h2 class="text-2xl font-bold mb-2">Error de Conexión</h2>
            <p>La pantalla no pudo comunicarse con la base de datos.</p>
            <p class="text-sm text-red-300 mt-4">Verifique que la URL de Apps Script en el código sea correcta y que haya publicado una "Nueva Versión".</p>
          </div>
        `;
      }
    }

    fetchData();
    setInterval(fetchData, 15000); 
  </script>

  <style>
    @keyframes pulse-red {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); box-shadow: 0 0 40px rgba(225, 29, 72, 1); border-color: #fda4af; }
    }
    .pulse-animation { animation: pulse-red 1.5s infinite; }
  </style>
</body>
</html>
